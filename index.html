<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS iOS 8 Remote</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; text-align: center; padding: 20px; }
        h1 { color: #00bfff; font-size: 24px; }
        .btn { display: inline-block; width: 85%; max-width: 300px; padding: 15px; margin: 10px; background: #333; border: 2px solid #555; border-radius: 8px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn:active { background: #00bfff; border-color: #fff; }
        /* COLOR PARA LA ESCENA SELECCIONADA EN VIVO */
        .btn.activo { background: #00bfff !important; border-color: #ff8888 !important; color: #fff !important; }
        .btn.activo { background: #00bfff !important; border-color: #00e5ff !important; color: #fff !important; }
        #status { font-weight: bold; color: #ff4444; margin-bottom: 20px; }

        /* ESTILOS PARA EL NUEVO BOTÓN DE TRANSMISIÓN */
        .btn-stream { background: #444; border-color: #666; margin-top: 25px; margin-bottom: 25px; }
        .btn-stream.transmitiendo { background: #cc0000 !important; border-color: #ff4444 !important; animation: parpadeo 1.5s infinite; }

        @keyframes parpadeo {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>OBS - Control remoto</h1>
    <div id="status">Conectando...</div>

    <!-- NUEVO: Botón para detener transmisión -->
    <div>
        <button id="btn-stop-stream" class="btn btn-stream">Terminar Transmisión</button>
    </div>

    <div id="scenes-container"></div>

    <script>
        // CONFIGURACIÓN DE COMPUTADORA
        var IP_PC = "192.168.1.71"; 
        var PUERTO = "4455";

        var statusDiv = document.getElementById('status');
        var container = document.getElementById('scenes-container');
        var btnStopStream = document.getElementById('btn-stop-stream');
        var ws;
        var escenaActual = "";

        // Lógica del botón Terminar Transmisión
        btnStopStream.onclick = function() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                var detenerStream = {
                    "op": 6,
                    "d": {
                        "requestType": "StopStream",
                        "requestId": "req_stream_stop"
                    }
                };
                ws.send(JSON.stringify(detenerStream));
            }
        };

        function conectar() {
            ws = new WebSocket('ws://' + IP_PC + ':' + PUERTO);

            ws.onopen = function() {
                var identificar = {
                    "op": 1,
                    "d": { "rpcVersion": 1 }
                };
                ws.send(JSON.stringify(identificar));
            };

            ws.onmessage = function(event) {
                var msg = JSON.parse(event.data);

                if (msg.op === 2) {
                    statusDiv.innerHTML = "CONECTADO";
                    statusDiv.style.color = "#44ff44";

                    // Pedimos la lista de escenas
                    var pedirEscenas = {
                        "op": 6,
                        "d": { "requestType": "GetSceneList", "requestId": "req_1" }
                    };
                    ws.send(JSON.stringify(pedirEscenas));

                    // NUEVO: Pedimos el estado actual de la transmisión al conectar
                    var pedirEstadoStream = {
                        "op": 6,
                        "d": { "requestType": "GetStreamStatus", "requestId": "req_stream_status" }
                    };
                    ws.send(JSON.stringify(pedirEstadoStream));
                }

                // Dibujar botones y detectar cuál es la activa al conectar
                if (msg.op === 7 && msg.d.requestType === "GetSceneList") {
                    escenaActual = msg.d.responseData.currentProgramSceneName;
                    var scenes = msg.d.responseData.scenes;
                    container.innerHTML = ""; 
                    for (var i = scenes.length - 1; i >= 0; i--) {
                        crearBoton(scenes[i].sceneName);
                    }
                    actualizarColorBotones();
                }

                // NUEVO: Procesar la respuesta del estado inicial de transmisión
                if (msg.op === 7 && msg.d.requestType === "GetStreamStatus") {
                    actualizarEstadoBotonStream(msg.d.responseData.outputActive);
                }

                // ESCUCHAR CAMBIOS DE ESCENA EN TIEMPO REAL (Evento op 5)
                if (msg.op === 5 && msg.d.eventType === "CurrentProgramSceneChanged") {
                    escenaActual = msg.d.eventData.sceneName;
                    actualizarColorBotones();
                }

                // NUEVO: Escuchar cambios de estado del Stream en tiempo real (Inicios / Paradas)
                if (msg.op === 5 && msg.d.eventType === "StreamStateChanged") {
                    actualizarEstadoBotonStream(msg.d.eventData.outputActive);
                }
            };

            ws.onerror = function() {
                statusDiv.innerHTML = "Error en el WebSocket.";
                statusDiv.style.color = "#ff4444";
            };

            ws.onclose = function() {
                statusDiv.innerHTML = "DESCONECTADO";
                statusDiv.style.color = "#ff4444";
                actualizarEstadoBotonStream(false);
            };
        }

        function crearBoton(nombreEscena) {
            var boton = document.createElement('button');
            boton.className = 'btn';
            // Guardamos el nombre de la escena en el botón para identificarlo después
            boton.setAttribute('data-scene', nombreEscena);
            boton.innerHTML = nombreEscena;
            boton.onclick = function() {
                var cambiarEscena = {
                    "op": 6,
                    "d": {
                        "requestType": "SetCurrentProgramScene",
                        "requestId": "req_2",
                        "requestData": { "sceneName": nombreEscena }
                    }
                };
                ws.send(JSON.stringify(cambiarEscena));
            };
            container.appendChild(boton);
        }

        // Función que limpia los colores y pinta únicamente el botón activo
        function actualizarColorBotones() {
            var botones = document.getElementsByClassName('btn');
            for (var i = 0; i < botones.length; i++) {
                // Evitamos alterar el botón de stream usando su ID
                if (botones[i].id === 'btn-stop-stream') continue;

                if (botones[i].getAttribute('data-scene') === escenaActual) {
                    botones[i].className = 'btn activo';
                } else {
                    botones[i].className = 'btn';
                }
            }
        }

        // NUEVO: Cambia visualmente el botón de stream si OBS está transmitiendo o no
        function actualizarEstadoBotonStream(estaActivo) {
            if (estaActivo) {
                btnStopStream.className = 'btn btn-stream transmitiendo';
                btnStopStream.innerHTML = '🔴 EN VIVO - DETENER';
            } else {
                btnStopStream.className = 'btn btn-stream';
                btnStopStream.innerHTML = 'Transmisión Apagada';
            }
        }

        conectar();
    </script>
</body>
