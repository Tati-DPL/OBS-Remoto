<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Control de escenas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101419;color:#edf1f5;font-family:-apple-system,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.shell{max-width:1000px;margin:auto;padding:30px 24px}header{border-bottom:1px solid #2a323c;padding-bottom:22px}.eyebrow{font-size:12px;letter-spacing:2px;color:#8997a6;text-transform:uppercase}h1{font-size:30px;font-weight:500;margin:8px 0 16px}.connection{font-size:14px;color:#adb9c6}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d39c4a;margin-right:8px}.online .dot{background:#59c7a2}.live-card{margin:24px 0;padding:22px;background:#192129;border:1px solid #303d49;border-radius:12px}.label{font-size:12px;letter-spacing:1px;color:#91a1b0;text-transform:uppercase}#current{font-size:28px;margin-top:10px;word-wrap:break-word}.section-title{font-size:14px;color:#a5b2bf;margin:28px 0 12px}.scenes{margin:0 -6px}.scene-wrap{display:inline-block;width:50%;padding:6px;vertical-align:top}button{font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}.scene{display:block;width:100%;min-height:100px;padding:20px;text-align:left;border:1px solid #303b47;border-radius:10px;background:#1b222b;color:#ecf1f6;font-size:21px;word-wrap:break-word}.scene small{display:block;margin-top:12px;color:#8999aa;font-size:11px;letter-spacing:1px}.scene.active{background:#17372f;border-color:#58bea0}.scene.active small{color:#85ddbd}.scene.pending{border-color:#d6ac69}.scene:active{background:#283541}button:disabled{opacity:.45;cursor:default}button:focus{outline:2px solid #7ba9cd;outline-offset:2px}.toolbar{border-top:1px solid #2a323c;margin-top:28px;padding-top:20px}.secondary{padding:12px 18px;border:1px solid #3a4653;border-radius:8px;background:transparent;color:#b5c2cf;font-size:15px}.stream{float:right;color:#dcb0b0;border-color:#634346}.stream-state{display:block;margin:18px 0;color:#8e9baa;font-size:13px}.error{min-height:24px;color:#e5b480;font-size:14px;line-height:1.5;margin:16px 0}.foot{color:#738393;font-size:12px;line-height:1.6}.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:10;padding:80px 20px;overflow:auto}.dialog{max-width:460px;margin:auto;background:#202832;border:1px solid #44505d;border-radius:12px;padding:26px}.dialog h2{font-size:23px;margin:0 0 15px}.dialog p{color:#b6c0cb;line-height:1.6}.dialog button{margin:8px 8px 0 0}.danger{background:#a93e43;border:1px solid #a93e43;color:white}.clearfix{clear:both}
@media(max-width:550px){.shell{padding:22px 16px}.scene-wrap{width:100%}.scene{min-height:80px}h1{font-size:26px}#current{font-size:24px}.stream{float:none;margin-top:12px;display:block}}

/* Distribución compatible con Safari iOS 8. */
.shell{padding:18px 22px;max-width:1200px}header{padding-bottom:12px}h1{font-size:24px;margin:6px 0 10px}.scenes{margin:14px -5px;font-size:0}.group{padding:0 5px;margin-bottom:12px}.group h2{font-size:12px;letter-spacing:2px;color:#93a5b5;text-transform:uppercase;margin:0 0 8px}.group-buttons{font-size:0}.scene-wrap{width:50%;padding:4px}.group-camera .scene-wrap{width:33.333%}.scene{min-height:58px;padding:12px;font-size:19px}.scene small{margin-top:8px;font-size:10px}.toolbar{margin-top:8px;padding-top:10px}.stream-state{margin:10px 0}.error{margin:6px 0;min-height:20px}.foot{font-size:11px}.scene.missing{opacity:.35}
@media(orientation:landscape) and (min-width:650px){.group{display:inline-block;vertical-align:top;width:33.333%;margin-bottom:0}.group .scene-wrap{width:100%}.shell header h1{display:inline-block;margin-right:24px}.shell .connection{display:inline-block}}
@media(max-width:600px){.scene{font-size:15px;padding:8px}.shell{padding:12px}.secondary{font-size:13px;padding:10px}.stream{float:right;margin-top:0}}
</style>
</head>
<body>
<main class="shell">
<header><div class="eyebrow">Producción · OBS</div><h1>Control de escenas</h1><div id="connection" class="connection" role="status"><span class="dot"></span><span id="status">Conectando…</span></div></header>

<div id="scenes" class="scenes"></div>
<div id="message" class="error" role="status"></div>
<div class="toolbar"><button id="reconnect" class="secondary" type="button">Reconectar</button><button id="stop" class="secondary stream" type="button" disabled>Terminar transmisión</button><div class="clearfix"></div><span id="stream-state" class="stream-state">Transmisión: estado desconocido</span></div>
<div class="foot">La selección se confirma con el estado de OBS.<br><span id="latency">Sin medición de respuesta</span></div>
</main>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog"><h2 id="dialog-title">¿Terminar la transmisión?</h2><p>Esto detendrá la emisión en OBS.</p><button id="cancel" class="secondary" type="button">Cancelar</button><button id="confirm" class="secondary danger" type="button">Terminar transmisión</button></div></div>
<script>
(function(){
    'use strict';
    // Conserva la dirección que ya funciona en tu iPad.
    var IP_PC = '192.168.1.55';
    var PUERTO = '4455';
    // Esta versión conserva la conexión sin contraseña del código original.
    var ws = null, ready = false, blocked = false, retry = null, attempts = 0;
    var sequence = 0, requests = {}, current = '', pendingScene = '', streamActive = null;
    var sceneButtons = [], sceneBusy = false, stopping = false, handshakeTimer = null;
    function el(id){return document.getElementById(id);}
    function say(text){el('message').textContent = text || '';}
    function status(text,online){el('status').textContent=text;el('connection').className='connection'+(online?' online':'');}
    function controls(){
        for(var i=0;i<sceneButtons.length;i++){
            var b=sceneButtons[i], name=b.getAttribute('data-scene');
            b.disabled=!ready || sceneBusy || b.getAttribute('data-missing')==='yes';
            b.className='scene'+(b.getAttribute('data-missing')==='yes'?' missing':'')+(name===current?' active':'')+(name===pendingScene?' pending':'');
            b.lastChild.textContent=b.getAttribute('data-missing')==='yes'?'NO EXISTE EN OBS':name===pendingScene?'ENVIANDO…':(name===current?'EN PROGRAMA':'SELECCIONAR');
            b.setAttribute('aria-pressed',name===current?'true':'false');
        }
        el('stop').disabled=!ready || streamActive!==true || stopping;
        el('stop').textContent=stopping?'Deteniendo…':'Terminar transmisión';

        el('stream-state').textContent=streamActive===null?'Transmisión: estado desconocido':(streamActive?'Transmisión en vivo':'Transmisión detenida');
    }
    function clearRequests(){for(var id in requests){if(requests.hasOwnProperty(id)){clearTimeout(requests[id].timer);}}requests={};sceneBusy=false;pendingScene='';stopping=false;}
    function request(type,data,callback){
        if(!ready || !ws || ws.readyState!==1){say('No hay conexión con OBS.');return;}
        var id='ipad_'+(++sequence), started=new Date().getTime();
        requests[id]={type:type,callback:callback,started:started,timer:setTimeout(function(){
            if(!requests[id])return;delete requests[id];sceneBusy=false;pendingScene='';stopping=false;
            say('OBS no confirmó '+type+'. Comprueba el estado antes de repetir.');controls();
        },7000)};
        try{ws.send(JSON.stringify({op:6,d:{requestType:type,requestId:id,requestData:data || {}}}));}
        catch(e){clearTimeout(requests[id].timer);delete requests[id];sceneBusy=false;pendingScene='';stopping=false;say('No se pudo enviar la petición.');controls();}
    }
    function stream(value){streamActive=typeof value==='boolean'?value:null;controls();}
    function refreshScenes(){request('GetSceneList',{},function(data){
        current=data.currentProgramSceneName || '';el('scenes').innerHTML='';sceneButtons=[];
        var scenes=data.scenes || [];
        drawGroups(scenes);
        controls();
    });}
    function addScene(name,parent,exists){
        var wrap=document.createElement('div'), button=document.createElement('button'), title=document.createElement('span'), tag=document.createElement('small');
        wrap.className='scene-wrap';button.type='button';button.className='scene';button.setAttribute('data-scene',name);if(!exists)button.setAttribute('data-missing','yes');title.textContent=name;tag.textContent='SELECCIONAR';button.appendChild(title);button.appendChild(tag);
        button.onclick=function(){
            if(!ready || sceneBusy || !exists || name===current)return;
            sceneBusy=true;pendingScene=name;say('');controls();
            request('SetCurrentProgramScene',{sceneName:name},function(){
                // Consultar el programa confirma también cambios durante transiciones.
                request('GetCurrentProgramScene',{},function(data){current=data.currentProgramSceneName || current;sceneBusy=false;pendingScene='';controls();});
            });
        };
        sceneButtons.push(button);wrap.appendChild(button);parent.appendChild(wrap);
    }
    function drawGroups(scenes){
        var groups=[['Transmisión',['Inicio','Final']],['Cámara',['Alabanza','Presentación','Prédica']],['AUX',['Fotos/Videos','En espera']]];
        for(var g=0;g<groups.length;g++){
            var group=document.createElement('section'), heading=document.createElement('h2'), list=document.createElement('div');
            group.className='group'+(g===1?' group-camera':'');heading.textContent=groups[g][0];list.className='group-buttons';group.appendChild(heading);group.appendChild(list);el('scenes').appendChild(group);
            for(var n=0;n<groups[g][1].length;n++){
                var name=groups[g][1][n], exists=false;
                for(var i=0;i<scenes.length;i++){if(scenes[i].sceneName===name)exists=true;}
                addScene(name,list,exists);
            }
        }
        fit();
    }
    function fit(){
        var h=window.innerHeight || document.documentElement.clientHeight;
        var w=window.innerWidth || document.documentElement.clientWidth;
        var overhead=w>=650 && w>h?225:315;
        var height=Math.max(58,Math.min(150,Math.floor((h-overhead)/3)));
        for(var i=0;i<sceneButtons.length;i++){sceneButtons[i].style.height=height+'px';sceneButtons[i].style.minHeight='58px';}
    }
    function schedule(){if(blocked || retry)return;var delay=Math.min(15000,1000*Math.pow(2,attempts++));retry=setTimeout(function(){retry=null;connect();},delay);}
    function connect(){
        clearTimeout(retry);retry=null;clearTimeout(handshakeTimer);clearRequests();ready=false;streamActive=null;controls();
        if(ws){ws.onclose=null;ws.onmessage=null;ws.onerror=null;try{ws.close();}catch(ignore){}}
        if(!window.WebSocket){blocked=true;status('WebSocket no disponible',false);return;}
        status('Conectando…',false);
        try{ws=new WebSocket('ws://'+IP_PC+':'+PUERTO);}catch(e){status('No se pudo abrir la conexión',false);say('Comprueba la dirección y si Safari bloquea ws:// desde una página HTTPS.');schedule();return;}
        var socket=ws;
        handshakeTimer=setTimeout(function(){if(socket===ws && !ready){socket.close();}},8000);
        socket.onmessage=function(event){
            if(socket!==ws)return;
            var msg;try{msg=JSON.parse(event.data);}catch(e){say('OBS envió una respuesta no reconocida.');return;}
            var d=msg.d || {};
            if(msg.op===0){
                if(d.authentication){blocked=true;say('OBS solicita contraseña. Esta versión usa la misma conexión sin contraseña que tu página original.');socket.close();return;}
                // Identificar únicamente después del Hello de OBS.
                socket.send(JSON.stringify({op:1,d:{rpcVersion:1,eventSubscriptions:69}}));
            }else if(msg.op===2){
                clearTimeout(handshakeTimer);ready=true;attempts=0;status('Conectado a OBS',true);say('');controls();refreshScenes();request('GetStreamStatus',{},function(data){stream(data.outputActive);});
            }else if(msg.op===7){
                var r=requests[d.requestId];if(!r)return;clearTimeout(r.timer);delete requests[d.requestId];
                if(!d.requestStatus || !d.requestStatus.result){sceneBusy=false;pendingScene='';stopping=false;say('OBS rechazó '+r.type+': '+((d.requestStatus || {}).comment || 'error '+((d.requestStatus || {}).code || 'desconocido')));controls();return;}
                if(r.type==='SetCurrentProgramScene'){el('latency').textContent='Respuesta de OBS: '+(new Date().getTime()-r.started)+' ms · no incluye cámara ni macros';}
                if(r.callback)r.callback(d.responseData || {});
            }else if(msg.op===5){
                var data=d.eventData || {};
                if(d.eventType==='CurrentProgramSceneChanged'){current=data.sceneName || '';controls();}
                else if(d.eventType==='StreamStateChanged'){stream(data.outputActive);if(data.outputActive===false){stopping=false;controls();}}
                else if(d.eventType==='SceneListChanged' || d.eventType==='SceneNameChanged' || d.eventType==='CurrentSceneCollectionChanged'){refreshScenes();}
            }
        };
        socket.onerror=function(){if(socket===ws){say('Comprueba Wi-Fi, IP, puerto y acceso al servidor WebSocket.');}};
        socket.onclose=function(){if(socket!==ws)return;clearTimeout(handshakeTimer);ready=false;streamActive=null;clearRequests();el('modal').style.display='none';status(blocked?'Se requiere configurar autenticación':'Desconectado · reconectando…',false);controls();schedule();};
    }
    el('reconnect').onclick=function(){blocked=false;attempts=0;connect();};
    el('stop').onclick=function(){if(ready && streamActive===true){el('modal').style.display='block';el('cancel').focus();}};
    el('cancel').onclick=function(){el('modal').style.display='none';el('stop').focus();};
    el('confirm').onclick=function(){
        el('modal').style.display='none';if(!ready || streamActive!==true || stopping)return;
        stopping=true;controls();request('StopStream',{},function(){request('GetStreamStatus',{},function(data){stopping=false;stream(data.outputActive);});});
    };
    document.addEventListener('visibilitychange',function(){if(!document.hidden){if(!ready || !ws || ws.readyState!==1){connect();}else{refreshScenes();request('GetStreamStatus',{},function(data){stream(data.outputActive);});}}},false);
    window.addEventListener('online',function(){if(!ready)connect();},false);
    window.addEventListener('resize',fit,false);
    window.addEventListener('orientationchange',function(){setTimeout(fit,250);},false);
    connect();
}());
</script>
</body>
</html>
