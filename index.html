<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS iOS 8 Remote</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; text-align: center; padding: 20px; }
        h1 { color: #00bfff; font-size: 24px; }
        .btn { display: inline-block; width: 85%; max-width: 300px; padding: 15px; margin: 10px; background: #333; border: 2px solid #555; border-radius: 8px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn:active { background: #00bfff; border-color: #fff; }
        /* COLOR PARA LA ESCENA SELECCIONADA EN VIVO */
        .btn.activo { background: #00bfff !important; border-color: #00e5ff !important; color: #fff !important; }
        #status { font-weight: bold; color: #ff4444; margin-bottom: 20px; }
        
        /* ESTILOS PARA EL NUEVO BOTÓN DE TRANSMISIÓN */
        .btn-stream { background: #444; border-color: #666; margin-top: 25px; margin-bottom: 25px; }
        .btn-stream.transmitiendo { background: #cc0000 !important; border-color: #ff4444 !important; animation: parpadeo 1.5s infinite; }
        
        @keyframes parpadeo {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* SECCIÓN DEL CONTROL DE PROYECTOR */
        .proyector-container { margin-top: 30px; padding: 15px; background: #222; border-radius: 10px; border: 1px solid #444; display: inline-block; width: 85%; max-width: 300px; }
        .proyector-title { font-size: 16px; color: #00bfff; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; }
        .btn-proyector { width: 90%; padding: 12px; margin: 5px 0; font-size: 16px; }
        .btn-stop { background: #d32f2f; border-color: #f44336; }
        .btn-stop:active { background: #b71c1c; border-color: #d32f2f; }
    </style>
</head>
<body>
    <h1>OBS - Control remoto</h1>
    <div id="status">Conectando...</div>
    
    <!-- NUEVO: Botón para detener transmisión -->
    <div>
        <button id="btn-stop-stream" class="btn btn-stream">Terminar Transmisión</button>
    </div>

    <div id="scenes-container"></div>

    <!-- SECCIÓN CONTROL REMOTO PROYECTOR -->
    <div class="proyector-container">
        <div class="proyector-title">Pantalla Proyector</div>
        <button class="btn btn-proyector" onclick="controlarPantalla('subir')">▲ SUBIR</button>
        <button class="btn btn-proyector btn-stop" onclick="controlarPantalla('stop')">■ STOP</button>
        <button class="btn btn-proyector" onclick="controlarPantalla('bajar')">▼ BAJAR</button>
    </div>

    <script>
        // CONFIGURACIÓN DE COMPUTADORA Y DISPOSITIVOS
        var IP_PC = "192.168.1.71"; 
        var PUERTO = "4455";
        var IP_SHELLY = "192.168.1.77";

        // Función para controlar el Shelly 2PM Gen3
        function controlarPantalla(accion) {
            let url = `http://${IP_SHELLY}/rpc/`;
            
            if (accion === 'subir') {
                url += 'Cover.GoTo?id=0&pos=100';
            } else if (accion === 'bajar') {
                url += 'Cover.GoTo?id=0&pos=0';
            } else if (accion === 'stop') {
                url += 'Cover.Stop?id=0';
            }

            // Llamada fetch en segundo plano (no recarga la página)
            fetch(url, { mode: 'no-cors' })
                .then(() => console.log(`Comando ${accion} enviado al proyector.`))
                .catch(err => console.error("Error al conectar con el Shelly:", err));
        }

        // Aquí continuaría el resto de tu lógica WebSocket para conectar con OBS...
        console.log("Listo para conectar a OBS en " + IP_PC + ":" + PUERTO);
    </script>
</body>
</html>
